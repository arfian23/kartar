<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Login - Sistem Informasi Karang Taruna Sendangan
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root{
            --forest-dark:#07231a;
            --forest:#0e3d2c;
            --forest-mid:#1c5c40;
            --forest-light:#2e8058;
            --gold:#d4af5a;
            --gold-soft:#f0d99a;
        }

        *{box-sizing:border-box;}

        body{

            margin:0;

            min-height:100vh;

            font-family:'Poppins',Segoe UI,Tahoma,Geneva,Verdana,sans-serif;

            position:relative;

            overflow-x:hidden;

            background:linear-gradient(160deg,#031712 0%,#0b2f22 35%,#134432 65%,#07231a 100%);

            background-size:200% 200%;

            animation:skyShift 22s ease infinite;

            color:#fff;

        }

        @keyframes skyShift{

            0%{background-position:0% 0%;}
            50%{background-position:100% 60%;}
            100%{background-position:0% 0%;}

        }

        /* ---------- NAVBAR ---------- */

        .navbar-custom{

            position:relative;

            z-index:5;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:22px 40px;

        }

        .brand{

            display:flex;

            align-items:center;

            gap:10px;

            font-weight:700;

            font-size:20px;

            letter-spacing:.5px;

        }

        .brand .bi{

            color:var(--gold);

            font-size:24px;

        }

        .nav-links{

            display:flex;

            gap:30px;

            align-items:center;

        }

        .nav-links a{

            color:rgba(255,255,255,.75);

            text-decoration:none;

            font-size:14.5px;

            font-weight:500;

            transition:color .2s;

        }

        .nav-links a:hover{

            color:var(--gold-soft);

        }

        .mini-flag{

            width:26px;

            height:17px;

            border-radius:2px;

            overflow:hidden;

            position:relative;

            display:inline-block;

            animation:wave 2.3s ease-in-out infinite;

            transform-origin:left center;

            box-shadow:0 2px 6px rgba(0,0,0,.4);

        }

        .mini-flag .red{position:absolute;top:0;left:0;right:0;height:50%;background:#e2231a;}
        .mini-flag .white{position:absolute;bottom:0;left:0;right:0;height:50%;background:#fff;}

        @keyframes wave{

            0%,100%{transform:perspective(100px) rotateY(0deg);}
            50%{transform:perspective(100px) rotateY(10deg);}

        }

        @media (max-width:700px){

            .nav-links a:not(.mini-flag-wrap){display:none;}

        }

        /* ---------- STARFIELD ---------- */

        .stars{

            position:absolute;

            inset:0;

            overflow:hidden;

            pointer-events:none;

            z-index:0;

        }

        .star{

            position:absolute;

            width:2px;height:2px;

            background:#fff;

            border-radius:50%;

            animation:twinkle 3s ease-in-out infinite;

        }

        @keyframes twinkle{

            0%,100%{opacity:.15;}
            50%{opacity:1;}

        }

        .shooting-star{

            position:absolute;

            width:2px;

            height:2px;

            background:linear-gradient(90deg,#fff,rgba(255,255,255,0));

            border-radius:50%;

            animation:shoot 6s linear infinite;

            opacity:0;

        }

        .shooting-star::before{

            content:"";

            position:absolute;

            top:50%;

            right:0;

            width:90px;

            height:1.5px;

            background:linear-gradient(270deg,rgba(255,255,255,.9),rgba(255,255,255,0));

            transform:translateY(-50%);

        }

        @keyframes shoot{

            0%{transform:translate(0,0);opacity:0;}
            2%{opacity:1;}
            18%{transform:translate(-420px,260px);opacity:0;}
            100%{opacity:0;}

        }

        /* ---------- FIREFLIES ---------- */

        .firefly{

            position:absolute;

            width:5px;height:5px;

            border-radius:50%;

            background:var(--gold-soft);

            box-shadow:0 0 8px 3px rgba(240,217,154,.6);

            animation:fly linear infinite;

            pointer-events:none;

            z-index:1;

        }

        @keyframes fly{

            0%{transform:translate(0,0);opacity:0;}
            10%{opacity:.9;}
            50%{transform:translate(30px,-40px);}
            90%{opacity:.7;}
            100%{transform:translate(-20px,-90px);opacity:0;}

        }

        /* ---------- FALLING LEAVES ---------- */

        .leaves{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}

        .leaf{

            position:absolute;

            top:-40px;

            font-size:18px;

            opacity:.7;

            animation-name:fall,sway;

            animation-timing-function:linear,ease-in-out;

            animation-iteration-count:infinite,infinite;

        }

        @keyframes fall{

            0%{transform:translateY(0) rotate(0deg);}
            100%{transform:translateY(115vh) rotate(360deg);}

        }

        @keyframes sway{

            0%,100%{margin-left:0;}
            50%{margin-left:35px;}

        }

        /* ---------- KAMPUNG SILHOUETTE ---------- */

        .skyline{

            position:absolute;

            bottom:0;

            left:0;

            width:100%;

            z-index:2;

            pointer-events:none;

            line-height:0;

        }

        .skyline svg{

            width:100%;

            height:auto;

            display:block;

        }

        .window-light{

            animation:glow 4s ease-in-out infinite;

        }

        @keyframes glow{

            0%,100%{opacity:.25;}
            50%{opacity:.95;}

        }

        /* ---------- LOGIN CARD ---------- */

        .center-wrap{

            position:relative;

            z-index:4;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:78vh;

            padding:20px;

        }

        .login-card{

            width:400px;

            border-radius:20px;

            padding:38px 36px 30px;

            background:rgba(20,50,38,.45);

            backdrop-filter:blur(18px) saturate(140%);

            -webkit-backdrop-filter:blur(18px) saturate(140%);

            border:1px solid rgba(212,175,90,.25);

            box-shadow:0 25px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);

            position:relative;

            animation:cardIn .6s ease;

        }

        @keyframes cardIn{

            from{opacity:0;transform:translateY(24px);}
            to{opacity:1;transform:translateY(0);}

        }

        .close-btn{

            position:absolute;

            top:16px;

            right:18px;

            width:28px;height:28px;

            border-radius:50%;

            background:rgba(255,255,255,.08);

            border:1px solid rgba(255,255,255,.15);

            display:flex;

            align-items:center;

            justify-content:center;

            color:rgba(255,255,255,.7);

            text-decoration:none;

            font-size:13px;

            transition:.2s;

        }

        .close-btn:hover{

            background:rgba(255,255,255,.18);

            color:#fff;

        }

        .login-card h3{

            font-weight:600;

            margin-bottom:2px;

            color:#fff;

        }

        .login-card .subtitle{

            color:rgba(255,255,255,.6);

            font-size:13px;

            margin-bottom:24px;

        }

        .form-label{

            color:rgba(255,255,255,.8);

            font-size:13.5px;

            font-weight:500;

        }

        .input-icon-wrap{

            position:relative;

        }

        .input-icon-wrap i{

            position:absolute;

            left:14px;

            top:50%;

            transform:translateY(-50%);

            color:rgba(255,255,255,.5);

            font-size:15px;

        }

        .glass-input{

            width:100%;

            padding:11px 14px 11px 40px;

            border-radius:10px;

            border:1px solid rgba(255,255,255,.15);

            background:rgba(255,255,255,.06);

            color:#fff;

            font-size:14px;

            outline:none;

            transition:.2s;

        }

        .glass-input::placeholder{

            color:rgba(255,255,255,.4);

        }

        .glass-input:focus{

            border-color:var(--gold);

            background:rgba(255,255,255,.1);

            box-shadow:0 0 0 3px rgba(212,175,90,.15);

        }

        .toggle-eye{

            position:absolute;

            right:8px;

            top:50%;

            transform:translateY(-50%);

            width:26px;

            height:26px;

            padding:0;

            margin:0;

            display:flex;

            align-items:center;

            justify-content:center;

            background:none;

            border:none;

            line-height:1;

            color:rgba(255,255,255,.5);

            cursor:pointer;

            font-size:15px;

        }

        .toggle-eye i{

            display:block;

            line-height:1;

        }

        .toggle-eye:hover{color:#fff;}

        .row-between{

            display:flex;

            justify-content:space-between;

            align-items:center;

            font-size:12.5px;

            color:rgba(255,255,255,.6);

            margin:14px 0 20px;

        }

        .row-between a{

            color:var(--gold-soft);

            text-decoration:none;

        }

        .form-check-input{

            background-color:rgba(255,255,255,.1);

            border-color:rgba(255,255,255,.3);

        }

        .form-check-input:checked{

            background-color:var(--forest-light);

            border-color:var(--forest-light);

        }

        .btn-login{

            width:100%;

            border:none;

            padding:12px;

            border-radius:10px;

            font-weight:600;

            font-size:14.5px;

            color:#08231a;

            background:linear-gradient(90deg,var(--gold-soft),var(--gold));

            transition:transform .15s ease, box-shadow .15s ease;

        }

        .btn-login:hover{

            transform:translateY(-2px);

            box-shadow:0 10px 24px rgba(212,175,90,.35);

            color:#08231a;

        }

        .divider-text{

            text-align:center;

            color:rgba(255,255,255,.35);

            font-size:12px;

            margin:18px 0 14px;

        }

        .register-link{

            text-align:center;

            font-size:13px;

            color:rgba(255,255,255,.6);

        }

        .register-link a{

            color:var(--gold-soft);

            font-weight:600;

            text-decoration:none;

        }

        .alert{

            font-size:13px;

            padding:10px 14px;

            border-radius:10px;

        }

    </style>

</head>

<body>

<!-- STARFIELD + SHOOTING STARS -->

<div class="stars" id="stars"></div>

<!-- FIREFLIES -->

<div class="leaves" id="fireflies"></div>

<!-- FALLING LEAVES -->

<div class="leaves" id="leaves"></div>

<!-- KAMPUNG SILHOUETTE -->

<div class="skyline">

    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

        <g fill="#0a2e21" opacity="0.9">
            <circle cx="60" cy="150" r="40"/>
            <rect x="55" y="150" width="10" height="40"/>
            <circle cx="180" cy="140" r="46"/>
            <rect x="174" y="140" width="12" height="50"/>
            <circle cx="1300" cy="145" r="42"/>
            <rect x="1294" y="145" width="12" height="45"/>
            <circle cx="1400" cy="135" r="48"/>
            <rect x="1394" y="135" width="12" height="55"/>
        </g>

        <g fill="#082019">

            <rect x="230" y="120" width="120" height="100"/>
            <polygon points="220,120 290,80 360,120"/>
            <rect x="300" y="150" width="18" height="24" class="window-light" fill="#f0d99a"/>
            <rect x="260" y="150" width="18" height="24" class="window-light" fill="#f0d99a" style="animation-delay:1s"/>

            <rect x="400" y="100" width="140" height="120"/>
            <polygon points="390,100 470,55 550,100"/>
            <rect x="430" y="140" width="20" height="26" class="window-light" fill="#f0d99a" style="animation-delay:2s"/>
            <rect x="480" y="140" width="20" height="26" class="window-light" fill="#f0d99a" style="animation-delay:.5s"/>

            <rect x="580" y="130" width="110" height="90"/>
            <polygon points="572,130 635,95 698,130"/>
            <rect x="615" y="155" width="16" height="22" class="window-light" fill="#f0d99a" style="animation-delay:1.5s"/>

            <rect x="750" y="110" width="130" height="110"/>
            <polygon points="742,110 815,68 888,110"/>
            <rect x="780" y="145" width="18" height="24" class="window-light" fill="#f0d99a" style="animation-delay:2.5s"/>
            <rect x="825" y="145" width="18" height="24" class="window-light" fill="#f0d99a" style="animation-delay:.8s"/>

            <rect x="930" y="125" width="110" height="95"/>
            <polygon points="922,125 985,90 1048,125"/>
            <rect x="965" y="150" width="16" height="22" class="window-light" fill="#f0d99a" style="animation-delay:1.8s"/>

            <rect x="1080" y="105" width="140" height="115"/>
            <polygon points="1072,105 1150,60 1228,105"/>
            <rect x="1110" y="140" width="18" height="24" class="window-light" fill="#f0d99a" style="animation-delay:.3s"/>
            <rect x="1160" y="140" width="18" height="24" class="window-light" fill="#f0d99a" style="animation-delay:2.2s"/>

        </g>

        <g fill="#051911">
            <circle cx="130" cy="180" r="34"/>
            <rect x="125" y="180" width="10" height="35"/>
            <circle cx="720" cy="185" r="30"/>
            <rect x="715" y="185" width="10" height="32"/>
            <circle cx="1000" cy="180" r="36"/>
            <rect x="995" y="180" width="10" height="36"/>
        </g>

        <rect x="0" y="205" width="1440" height="15" fill="#04140e"/>

    </svg>

</div>

<!-- NAVBAR -->

<nav class="navbar-custom">

    <div class="brand">

        <i class="bi bi-tree-fill"></i>

        Karang Taruna Sendangan

    </div>

    <div class="nav-links">

        <span class="mini-flag" title="Indonesia">

            <span class="red"></span>
            <span class="white"></span>

        </span>

    </div>

</nav>

<!-- LOGIN CARD -->

<div class="center-wrap">

    <div class="login-card">

        <h3>Login</h3>

        <p class="subtitle">Sistem Informasi Kas Karang Taruna</p>


        <!-- REGISTER SUCCESS -->

        {% if success == "register" %}

        <div class="alert alert-success mb-3">

            <strong>Registrasi berhasil!</strong> Silakan login menggunakan akun baru Anda.

        </div>

        {% endif %}


        <!-- ERROR -->

        {% if error %}

        <div class="alert alert-danger mb-3">

            {{ error }}

        </div>

        {% endif %}


        <!-- FORM LOGIN -->

        <form method="POST" action="/login">

            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">Username</label>

                <div class="input-icon-wrap">

                    <i class="bi bi-person-fill"></i>

                    <input
                        type="text"
                        name="username"
                        class="glass-input"
                        placeholder="Masukkan username"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">Password</label>

                <div class="input-icon-wrap">

                    <i class="bi bi-lock-fill"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="glass-input"
                        style="padding-right:40px"
                        placeholder="Masukkan password"
                        required>

                    <button
                        type="button"
                        class="toggle-eye"
                        id="buttonPassword"
                        onclick="togglePassword()">

                        <i class="bi bi-eye" id="iconPassword"></i>

                    </button>

                </div>

            </div>

            <!-- BUTTON LOGIN -->

            <button type="submit" class="btn-login">

                Login

            </button>

        </form>

        <div class="divider-text">— atau —</div>

        <!-- REGISTER -->

        <div class="register-link">

            Belum punya akun? <a href="/register">Daftar di sini</a>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


<!-- SHOW / HIDE PASSWORD -->

<script>

function togglePassword(){

    const input = document.getElementById("password");
    const icon = document.getElementById("iconPassword");

    if(input.type==="password"){

        input.type="text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");

    }else{

        input.type="password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");

    }

}

</script>

<!-- STARS GENERATOR -->

<script>

(function(){

    const starsBox = document.getElementById("stars");

    for(let i=0;i<80;i++){

        const s = document.createElement("div");

        s.className = "star";

        s.style.top = Math.random()*70+"%";
        s.style.left = Math.random()*100+"%";

        s.style.animationDuration = (Math.random()*3+2)+"s";
        s.style.animationDelay = (Math.random()*4)+"s";

        starsBox.appendChild(s);

    }

    for(let i=0;i<4;i++){

        const sh = document.createElement("div");

        sh.className = "shooting-star";

        sh.style.top = (Math.random()*30+5)+"%";
        sh.style.left = (Math.random()*50+40)+"%";

        sh.style.animationDuration = (Math.random()*4+5)+"s";
        sh.style.animationDelay = (Math.random()*8)+"s";

        starsBox.appendChild(sh);

    }

})();

</script>

<!-- FIREFLIES GENERATOR -->

<script>

(function(){

    const box = document.getElementById("fireflies");

    for(let i=0;i<14;i++){

        const f = document.createElement("div");

        f.className = "firefly";

        f.style.left = Math.random()*100+"vw";
        f.style.top = (Math.random()*30+55)+"vh";

        f.style.animationDuration = (Math.random()*6+6)+"s";
        f.style.animationDelay = (Math.random()*6)+"s";

        box.appendChild(f);

    }

})();

</script>

<!-- FALLING LEAVES GENERATOR -->

<script>

(function(){

    const container = document.getElementById("leaves");

    const emojis = ["🍃","🍂","🌿"];

    const count = 12;

    for(let i=0;i<count;i++){

        const leaf = document.createElement("div");

        leaf.className = "leaf";

        leaf.textContent = emojis[Math.floor(Math.random()*emojis.length)];

        leaf.style.left = Math.random()*100+"vw";

        const fallDuration = Math.random()*10+12;
        const swayDuration = Math.random()*3+2;

        leaf.style.animationDuration = fallDuration+"s, "+swayDuration+"s";
        leaf.style.animationDelay = (Math.random()*fallDuration)+"s, 0s";

        leaf.style.fontSize = (Math.random()*8+14)+"px";

        container.appendChild(leaf);

    }

})();

</script>

</body>
</html>
