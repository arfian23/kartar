<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Sistem Informasi Karang Taruna Sendangan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{

            background:linear-gradient(135deg,#198754,#0d6efd);

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;

        }

        .register-card{

            width:450px;

            border:none;

            border-radius:18px;

            box-shadow:0 20px 40px rgba(0,0,0,.15);

        }

        .register-header{

            text-align:center;

            margin-bottom:25px;

        }

        .register-header i{

            font-size:60px;

            color:#198754;

        }

        .btn-register{

            width:100%;

            padding:12px;

            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="card register-card">

    <div class="card-body p-5">

        <div class="register-header">

            <i class="bi bi-person-plus-fill"></i>

            <h3 class="mt-3">

                Registrasi Akun

            </h3>

            <p class="text-muted">

                Sistem Informasi Karang Taruna Sendangan

            </p>

        </div>

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}

        <form method="POST" action="/register">

            <div class="mb-3">

                <label class="form-label">

                    Nama Lengkap

                </label>

                <input
                    type="text"
                    name="nama"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Konfirmasi Password

                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success btn-register">

                <i class="bi bi-person-check-fill me-2"></i>

                Daftar

            </button>

        </form>

        <hr>

        <div class="text-center">

            Sudah punya akun?

            <a href="/login">

                Login di sini

            </a>

        </div>

    </div>

</div>

</body>

</html>
