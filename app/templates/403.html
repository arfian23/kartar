{% extends "base.html" %}

{% block title %}
403 Forbidden
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body text-center py-5">

            <i class="bi bi-shield-lock-fill text-danger"
               style="font-size:70px;"></i>

            <h2 class="mt-3">

                403 - Forbidden

            </h2>

            <p class="text-muted">

                {{ message }}

            </p>

            <a href="/"
               class="btn btn-primary mt-3">

                Kembali ke Dashboard

            </a>

        </div>

    </div>

</div>

{% endblock %}
